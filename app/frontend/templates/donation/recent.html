<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transaction Logs</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>Transaction Logs</h1>
  <p class="subtitle">
    Teens Club financial activity.
  </p>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th class="col-view-issuer">Name</th>
          <th class="col-view-amount">Amount</th>
          <th class="col-view-description">Detail</th>
        </tr>
      </thead>
      <tbody>
        {% for transaction in transactions %}
        <tr>
          <td>
            {{ transaction.issuer }}
          </td>
  
          <td class="amount {{ transaction.type.value }}">
              {{ transaction.amount | rupiah }}
          </td>

          <td>
            {{ transaction.description or "No detail provided." }}
          </td>
          </td>
        </tr>
        {% else %}
        <tr>
          <td colspan="5" class="empty-state">
            No transactions found.
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
